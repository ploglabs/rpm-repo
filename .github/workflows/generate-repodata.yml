name: Generate RPM Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate repodata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq createrepo-c
          for dir in el/*/; do
            for arch in "$dir"*/; do
              if ls "$arch"*.rpm 1>/dev/null 2>&1; then
                createrepo_c --update "$arch"
              fi
            done
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
